<body>

    <main>
        <x-centre>Rich was here

    <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
        crossorigin="anonymous"></script>
    <script src="https://custom-element.pages.dev/custom-element.js" crossorigin="anonymous"></script>
    <script>
        // Define a class that extends the standard HTML element
class MyGreeting extends HTMLElement {
  connectedCallback() {
    // This lifecycle method runs when the element is added to the DOM
    this.innerHTML = `<h1>Hello, World! This is a custom element.</h1>`;
  }
}

// Register the custom element with a mandatory hyphenated tag name
customElements.define('my-greeting', MyGreeting);

class ThisYear extends HTMLElement {
    connectedCallback() {
        const currentYear = new Date().getFullYear();
        this.innerHTML = `<p>&copy; ${currentYear}</p>`;
    }
}
customElements.define('this-year', ThisYear);

class Centre extends HTMLElement {
    connectedCallback() {
        this.innerHTML = `<div style="display: flex; justify-content: center; align-items: center;">${this.innerHTML}</div>`;
    }
}
customElements.define('x-centre', Centre);

    </script>
